<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buffera — в объёме</title>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08070b}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
#film{position:relative;width:1920px;height:1080px;overflow:hidden;color:white;background:#08070b}
canvas{position:absolute;inset:0;width:1920px;height:1080px;display:block}
.shot{position:absolute;inset:0;visibility:hidden;pointer-events:none}
h1,h2,p{margin:0}.title{position:absolute;font-size:170px;font-weight:670;line-height:.95;letter-spacing:-9px}
#intro .title{left:110px;top:100px;font-size:190px}
#intro .descriptor{position:absolute;left:120px;top:322px;font-size:34px;letter-spacing:-.8px;color:#d3cbdc}
#hero{color:#101014}#hero .title{left:112px;top:375px;font-size:173px;line-height:.92}
#poke{position:absolute;width:65px;height:83px;filter:drop-shadow(0 6px 8px #0005)}
#capture .title{top:100px;left:0;width:100%;text-align:center;font-size:137px;letter-spacing:-7px}
#retrieve{color:#121017}#retrieve .title{top:115px;left:0;width:100%;text-align:center;font-size:151px}
#link{position:absolute;left:490px;top:426px;width:940px;height:215px;display:flex;align-items:center;gap:34px;padding:48px;background:linear-gradient(130deg,#ffffffed,#fbf8ffed);border:1px solid #ddd4e8;border-radius:26px;box-shadow:0 30px 70px -35px #45265b60;font-size:70px;font-weight:570;letter-spacing:-3px;transform-origin:center}
#link .glyph{font-weight:400;color:#a775f0;font-size:89px;line-height:1}
#shortcut{position:absolute;left:0;top:785px;width:100%;text-align:center;font-size:80px;letter-spacing:-2px;color:#51356f}
#joke .title{left:0;top:95px;width:100%;text-align:center;font-size:137px;line-height:1.04;letter-spacing:-6px}
#twist{color:#111015}#twist .title{left:0;top:104px;width:100%;text-align:center;font-size:180px;letter-spacing:-8px}
#end .title{left:0;top:563px;width:100%;text-align:center;font-size:164px;letter-spacing:-8px}
#tagline{position:absolute;top:766px;left:0;width:100%;text-align:center;font-size:46px;font-weight:480;letter-spacing:-1.8px;color:#e7ddf0}
#url{position:absolute;top:915px;left:0;width:100%;text-align:center;font-size:44px;font-weight:530;letter-spacing:-1px;color:#cda0ff}
</style>
<div id="film">
 <canvas id="stage" width="1920" height="1080"></canvas>
 <section id="intro" class="shot"><h1 class="title">Память.</h1><p class="descriptor">История буфера обмена для Mac</p></section>
 <section id="hero" class="shot"><h1 class="title">В<br>объёме.</h1><svg id="poke" viewBox="0 0 45 58"><path d="M7 3L38 33L23 35L17 50Z" fill="#fff" stroke="#242126" stroke-width="2.7" stroke-linejoin="round"/></svg></section>
 <section id="capture" class="shot"><h1 class="title">Скопировал.</h1></section>
 <section id="retrieve" class="shot"><h1 class="title">Всё здесь.</h1><div id="link"><span class="glyph">↗</span><span>Та самая ссылка.</span></div><div id="shortcut">⌘ V</div></section>
 <section id="joke" class="shot"><h1 class="title">Размер имеет<br>значение.</h1></section>
 <section id="twist" class="shot"><h1 class="title">У памяти.</h1></section>
 <section id="end" class="shot"><h1 class="title">Buffera</h1><p id="tagline">Хорошие буфера. Всё помнят.</p><p id="url">buffera.app</p></section>
</div>
<script type="module">
import {createStage} from './stage.mjs';
const $=s=>document.querySelector(s),clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>1-Math.pow(1-clamp(x),4);
const range=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,t)=>a+(b-a)*t;
const allShots=[...document.querySelectorAll('.shot')];
function show(selector,alpha,transform=''){
 const el=$(selector);el.style.opacity=clamp(alpha);el.style.transform=transform;
}
window.__ready=(async()=>{
 const stage=await createStage($('#stage'));
 window.setFrame=t=>{
  stage.render(t);
  const shot=t<1.6?'intro':t<3.2?'hero':t<5.6?'capture':t<6.4?'retrieve':t<8?'joke':t<9.6?'twist':'end';
  for(const el of allShots)el.style.visibility=el.id===shot?'visible':'hidden';
  if(shot==='intro'){
   show('#intro .title',1,`translateY(${mix(16,0,ease(t/.18))}px)`);
   show('#intro .descriptor',ease((t-.2)/.2));
  }
  if(shot==='hero'){
   const s=t-1.6;
   show('#hero .title',1,`translateX(${mix(-40,0,ease(s/.22))}px)`);
   const a=ease(range(t,1.72,2)),d=ease(range(t,2.1,2.42));
   show('#poke',ease(range(t,1.65,1.77))*(1-ease(range(t,2.3,2.5))),`translate(${mix(1640,1340,a)+150*d}px,${mix(840,550,a)+110*d}px) scale(${1-.15*Math.sin(Math.PI*range(t,1.98,2.12))})`);
  }
  if(shot==='capture'){
   const part=Math.min(2,Math.floor((t-3.2)/.8)),s=t-(3.2+part*.8);
   $('#capture .title').textContent=['Скопировал.','Ещё раз.','И ещё.'][part];
   show('#capture .title',1,`translateY(${mix(20,0,ease(s/.15))}px) scale(${mix(1.04,1,ease(s/.25))})`);
  }
  if(shot==='retrieve'){
   const s=t-5.6,p=ease(s/.24);
   show('#retrieve .title',1,`scale(${mix(1.06,1,p)})`);
   show('#link',1,`perspective(1200px) translateY(${mix(250,0,p)}px) rotateX(${mix(33,0,p)}deg) scale(${mix(.65,1,p)})`);
   show('#shortcut',ease(s/.12),`scale(${1-.10*Math.sin(Math.PI*range(s,.26,.47))})`);
  }
  if(shot==='joke'){
   show('#joke .title',1,`scale(${mix(.96,1,ease((t-6.4)/.3))})`);
  }
  if(shot==='twist'){
   show('#twist .title',1,`translateY(${mix(-35,0,ease((t-8)/.2))}px)`);
  }
  if(shot==='end'){
   const s=t-9.6;
   show('#end .title',1,`translateY(${mix(40,0,ease(s/.3))}px)`);
   show('#tagline',ease((s-.15)/.25));
   show('#url',ease((s-.35)/.2));
  }
 };
 window.setFrame(0);
 return true;
})();
if(new URLSearchParams(location.search).has('play')){
 await window.__ready;const start=performance.now();
 const tick=now=>{window.setFrame(((now-start)/1000)%12.8);requestAnimationFrame(tick)};requestAnimationFrame(tick);
}
</script>
</html>
